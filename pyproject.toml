[project]
name = "fly-in"
version = "0.1.0"
description = "Drone fleet routing simulation"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pygame-ce>=2.5.8",
    "pygame-gui>=0.6.14",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "flake8>=7.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.10"
strict = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 79
